name: "Heizungsanlagenmanager via BSB-LAN"
version: "1.22.1"
# Der slug steckt in der Ingress-Adresse und – über DEVICE_ID – in den
# Entitäts-IDs (sensor.heizungsanlage_p72). Wer ihn ändert, bekommt vom
# Supervisor ein neues Add-on: Neuinstallation, und die Daten des alten
# müssen mit umziehen. Nicht leichtfertig anfassen.
slug: "heizungsanlage"
description: "Deutsch und Englisch. Die Heizungsregelung über BSB-LAN bedienen: Kategorien wie am Kessel, Zeitprogramme als Wochentabelle, Sollwerte stellen – und die Werte nach Home Assistant bringen."
url: "https://github.com/Melle79/HA-heizungsanlagenmanager"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:water-boiler"
panel_title: "Heizkessel"
homeassistant_api: true
# Für network/info: Die Broker-Adresse, die BSB-LAN erreicht, steht nur dort.
hassio_api: true
services:
  - "mqtt:need"
options: {}
schema: {}
